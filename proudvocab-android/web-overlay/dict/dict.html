<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline dictionary</title>
<link rel="stylesheet" href="dict.css">
<script src="/android-bridge.js"></script>
</head>
<body>
  <header class="bar">
    <button id="back" class="icon" aria-label="Close">✕</button>
    <h1 id="title">Offline dictionary</h1>
  </header>

  <main id="main">
    <section id="status" class="card"></section>

    <section id="searchWrap" class="card" hidden>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search a word…">
      <ul id="results" class="list"></ul>
    </section>

    <section id="detail" class="card" hidden></section>
  </main>

  <div id="toast" hidden></div>
  <script src="dict.js"></script>
</body>
</html>
