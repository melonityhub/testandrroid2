name: Android APK (build + release)

# Every push to ANY branch that touches the app builds + signs the APK and publishes a GitHub
# Release automatically:
#   * main / master      -> stable release, tag  android-v<VERSION>.<run number>   (e.g. android-v1.0.7)
#   * any other branch   -> pre-release,  tag  android-v<VERSION>.<run number>-<branch slug>
#                           (e.g. android-v1.0.8-arena-8af23411-testandrroid2), marked as prerelease
#                           so "Latest" always stays on a main-branch build
# Put  [skip release]  in the commit message to only build (artifact) without publishing.
# Pull requests only build. You can also push your own tag (android-v2.0.0) or use "Run workflow".
on:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths:
      - 'proudvocab-android/**'
      - 'proudvocab-desktop/src/renderer/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'proudvocab-android/**'
      - 'proudvocab-desktop/src/renderer/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (the tag android-v<version> is created automatically)'
        type: boolean
        default: true
      version:
        description: 'Version, e.g. 2.0.0 (empty = VERSION file + run number)'
        type: string
        required: false

permissions:
  contents: write   # needed to create the Release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: proudvocab-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make sure the Android SDK pieces exist (no-op on GitHub runners)
        run: |
          set +e
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          fi
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>/dev/null
          exit 0

      - name: Pre-build checklist (web bundle, license removal, XML, Java compile, JVM tests)
        run: bash scripts/verify.sh

      - name: Work out the version (and whether to publish)
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          IN_RELEASE: ${{ inputs.release }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          BASE="$(tr -d ' \r\n' < VERSION)"
          RELEASE=false
          RELEASE_SUFFIX=""
          PRERELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/android-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/android-v}"
            RELEASE=true
          elif [ "$EVENT" = "push" ]; then
            if [[ "$GITHUB_REF_NAME" == "main" || "$GITHUB_REF_NAME" == "master" ]]; then
              VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
            else
              # every other branch gets its own (pre-)release; the branch slug keeps
              # builds of parallel branches apart and makes the tag/name self-explanatory
              SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-' | tr -c 'a-zA-Z0-9._-' '-' | sed -E 's/-+/-/g; s/^-+//; s/-+$//' | cut -c1-40)"
              RELEASE_SUFFIX="-$SLUG"
              VERSION="${BASE}.${GITHUB_RUN_NUMBER}${RELEASE_SUFFIX}"
              PRERELEASE=true
            fi
            RELEASE=true
            case "$COMMIT_MSG" in *"[skip release]"*) RELEASE=false ;; esac
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="${IN_VERSION:-${BASE}.${GITHUB_RUN_NUMBER}}"
            RELEASE="${IN_RELEASE:-true}"
          else
            VERSION="${BASE}.0-pr.${GITHUB_RUN_NUMBER}"
          fi
          # anything with a suffix (branch builds, 2.0.0-beta, ...) is a prerelease
          [[ "$VERSION" == *-* ]] && PRERELEASE=true
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            # 1.0.7 -> 1000007 : always grows with the version, so every release installs over the previous one
            CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          else
            echo "::error::Version '$VERSION' must look like 1.2.3"; exit 1
          fi
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "code=$CODE"            >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE"      >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "suffix=$RELEASE_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (versionCode $CODE, publish=$RELEASE, prerelease=$PRERELEASE)"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the signed release APK
        run: gradle --no-daemon --stacktrace assembleRelease -PpvVersionName="${{ steps.ver.outputs.version }}" -PpvVersionCode="${{ steps.ver.outputs.code }}"

      - name: Check the APK (signature, package, minSdk)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::APK not found"; ls -R app/build/outputs || true; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|uses-permission|application-label:)" badging.txt
          grep -q "name='app.proudvocab.android'" badging.txt
          # older aapt2 prints sdkVersion:'28', newer prints minSdkVersion:'28' - accept both
          grep -Eq "^(min)?[sS]dkVersion:'28'" badging.txt || { echo "::error::minSdk is not 28"; exit 1; }
          # only INTERNET may be requested
          PERMS=$(grep -c "^uses-permission" badging.txt || true)
          [ "$PERMS" = "1" ] || { echo "::error::unexpected permissions in the APK"; grep "^uses-permission" badging.txt; exit 1; }
          cp "$APK" "ProudVocab-${{ steps.ver.outputs.version }}.apk"
          sha256sum "ProudVocab-${{ steps.ver.outputs.version }}.apk" | tee "ProudVocab-${{ steps.ver.outputs.version }}.apk.sha256"
          ls -l "ProudVocab-${{ steps.ver.outputs.version }}.apk"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProudVocab-${{ steps.ver.outputs.version }}-apk
          path: proudvocab-android/ProudVocab-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish the GitHub Release (tag is created automatically)
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="android-v$V"
          APK="ProudVocab-$V.apk"
          SUM="$APK.sha256"
          COMMON="one universal APK for Android 9+ (arm64-v8a, armeabi-v7a, x86, x86_64: the app has no native code, so the same file runs everywhere; POCO X3 Pro = arm64). Download the APK, open it and allow installs from your browser / file manager when Android asks. Commit: $GITHUB_SHA"
          PRE=()
          TITLE="ProudVocab $V"
          if [[ "${{ steps.ver.outputs.suffix }}" != "" ]]; then
            TITLE="ProudVocab $V (branch: $GITHUB_REF_NAME)"
            NOTES="ProudVocab for Android $V - automatic build of the branch **$GITHUB_REF_NAME** (pre-release). $COMMON"
          else
            NOTES="ProudVocab for Android $V - $COMMON"
          fi
          [[ "${{ steps.ver.outputs.prerelease }}" == "true" ]] && PRE=(--prerelease)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUM" --clobber
          else
            gh release create "$TAG" "$APK" "$SUM" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" "${PRE[@]}"
          fi
          echo "Released: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
